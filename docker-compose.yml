services:

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"        # Ollama API (accessible from host if needed)
    volumes:
      - ollama_data:/root/.ollama   # persist downloaded models
    # Uncomment the lines below if your EC2 instance has a GPU (e.g. g4dn / p3):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  chatbot:
    build: .
    container_name: chatbot
    restart: unless-stopped
    ports:
      - "8000:8000"          # Chatbot UI + API
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2}
    depends_on:
      ollama:
        condition: service_healthy

volumes:
  ollama_data:
